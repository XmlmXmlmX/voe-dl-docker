name: Build and publish Docker images

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and app version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            MAJOR="${VERSION%%.*}"
            MINOR="${VERSION#*.}"
            MINOR="${MINOR%%.*}"

            TAGS=$'v'"${VERSION}"$'\n'"${VERSION}"$'\n'"${MAJOR}.${MINOR}"$'\n'"${MAJOR}"$'\n'"latest"
            APP_VERSION="${VERSION}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            SANITIZED_BRANCH="$(echo "${BRANCH}" | sed -E 's#[^A-Za-z0-9_.-]+#-#g' | tr '[:upper:]' '[:lower:]')"
            SHORT_SHA="${GITHUB_SHA:0:7}"

            TAGS="${SANITIZED_BRANCH}"$'\n'"${SANITIZED_BRANCH}-build${GITHUB_RUN_NUMBER}"$'\n'"sha-${SHORT_SHA}"$'\n'"preview"
            APP_VERSION="prerelease-${GITHUB_RUN_NUMBER}"
          fi

          cat <<EOF >> "$GITHUB_OUTPUT"
app_version=${APP_VERSION}
image_tags<<EOF
${TAGS}
EOF
EOF

          full_tags=""
          while IFS= read -r tag; do
            full_tags+="${DOCKERHUB_IMAGE}:${tag}\n${GHCR_IMAGE}:${tag}\n"
          done <<< "${TAGS}"

          cat <<EOF >> "$GITHUB_OUTPUT"
full_tags<<EOF
${full_tags}
EOF
EOF

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.full_tags }}
          build-args: APP_VERSION=${{ steps.metadata.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
