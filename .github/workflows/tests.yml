name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore src/VoeDl.Tests/VoeDl.Tests.csproj

      - name: Run tests
        run: dotnet test src/VoeDl.Tests/VoeDl.Tests.csproj --no-restore --logger "console;verbosity=detailed"
