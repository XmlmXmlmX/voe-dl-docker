services:
  voe-dl:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "5000:5000"
    volumes:
      - ${DOWNLOAD_PATH:-./downloads}:/downloads
    environment:
      - DOWNLOAD_DIR=/downloads
      - ConnectionStrings__DefaultConnection=Host=db;Database=voedl;Username=voedl;Password=${POSTGRES_PASSWORD:-voedl_pass}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=voedl
      - POSTGRES_USER=voedl
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-voedl_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voedl -d voedl"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
